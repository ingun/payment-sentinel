[pytest]
testpaths = tests
# langsmith'in otomatik pytest eklentisi kullanılmıyor; ayrıca yerel uuid_utils DLL'ini src yüklenmeden
# önce içe aktardığı için uygulama denetimi politikası olan Windows makinelerinde test oturumunu durdurur.
addopts = -p no:langsmith_plugin
filterwarnings =
    ignore::DeprecationWarning:langsmith.*
    # Streamlit'in kendi grafik kodundaki pandas 3.1 kullanımdan kaldırma uyarısı (proje kodu değil)
    ignore:The inplace keyword in DataFrame.reset_index:FutureWarning
    ignore:The inplace keyword in DataFrame.reset_index
